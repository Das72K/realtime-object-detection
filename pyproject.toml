[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtod"
version = "0.1.0"
description = "Real-time object detection, tracking and line/zone counting with Ultralytics YOLO + ONNX Runtime"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dorin Dascălu" }]
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# GPU: after installing, swap onnxruntime for onnxruntime-gpu (README "Benchmark"); don't reinstall this extra afterwards
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxslim>=0.1", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
rtod = "rtod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
